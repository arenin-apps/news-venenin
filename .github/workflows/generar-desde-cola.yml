name: Generar posts desde la cola de ARenIN

on:
  schedule:
    # ARenIN deja las URLs de sus notas nuevas en una cola; cada 4 horas se crean las versiones VENenIN.
    - cron: '30 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cola-venenin
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Procesar la cola
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ADSENSE_INARTICLE_SLOT: ${{ secrets.ADSENSE_INARTICLE_SLOT }}
        run: node scripts/generar-desde-cola.mjs

      - name: Guardar cola-procesada.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cola-procesada.json
          git diff --staged --quiet || git commit -m "Actualizar cola-procesada.json"
          git push
